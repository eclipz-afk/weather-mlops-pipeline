name: deployment

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: services/mlflow
      dockerfile: Dockerfile
    image: weather-mlops-mlflow:v3.16.0
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: ${S3_REGION}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_SERVER_JOB_ENABLE_PERIODIC_TASKS: "false"
    volumes:
      - mlflow_data:/mlflow
    command: >-
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination s3://${S3_BUCKET}/mlflow-artifacts
      --host 0.0.0.0
      --port 5000
      --workers 1
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow,mlflow:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"
        ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SERVING_MODEL_URI: models:/weather-temperature-forecaster@champion
      SERVING_DATASET_ID: weather-kazan-2000-2026-v1
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      API_BASE_URL: http://api:8000

  airflow-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: services/airflow/Dockerfile
    image: weather-mlops-airflow:2.10.5
    depends_on:
      airflow-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD:-airflow}@airflow-postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-mF0VfGRy_4Hxyyjt0sZqRTN1tYCfz4pH0K2MOzXJM0g=}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-replace-this-local-secret}
      PYTHONPATH: /opt/airflow
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    volumes: &airflow-volumes
      - ./services/airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create
        --username "$${AIRFLOW_ADMIN_USERNAME}"
        --password "$${AIRFLOW_ADMIN_PASSWORD}"
        --firstname Local
        --lastname Admin
        --role Admin
        --email local-admin@example.com || true)

  airflow-webserver:
    image: weather-mlops-airflow:2.10.5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: webserver

  airflow-scheduler:
    image: weather-mlops-airflow:2.10.5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: scheduler

volumes:
  minio_data:
  mlflow_data:
  airflow_postgres_data:
  airflow_logs:
